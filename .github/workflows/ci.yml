name: CI / Susi Air Pilot App Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: NestJS API Quality Gate (Unit & E2E)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Backend Unit Tests
        run: pnpm --filter nest test

      - name: Run Backend E2E Smoke Tests
        run: pnpm --filter nest test:e2e

      - name: Build NestJS Application
        run: pnpm --filter nest build

  frontend-qa:
    name: Nuxt 3 Frontend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Nuxt 3 Production Application
        run: pnpm --filter nuxt build
        env:
          NUXT_TELEMETRY_DISABLED: '1'
          NUXT_PUBLIC_API_BASE: 'http://localhost:3001'

  docker-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-qa]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: nest/Dockerfile
          push: false
          tags: susiair-pilot-api:ci
